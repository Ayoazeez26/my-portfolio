title: HSCT
description: Owned frontend architecture for HSCT (hsct.ai), a virtual care office platform serving 500+ active users that helps care providers win tenders, stay compliant, and run day-to-day operations. Designed and shipped Olivia, an ambient voice assistant using text-to-speech and OpenAI for conversational onboarding and incident reporting, and implemented OAuth-based authentication across the Vue/Nuxt frontend and NestJS backend.
